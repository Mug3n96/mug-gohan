services:
  backend:
    build: ./backend
    image: mug3n96/mug-gohan:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
      - ./branding:/app/branding:ro
    depends_on:
      ollama:
        condition: service_healthy

  # Not needed with OLLAMA_HOST=https://ollama.com: remove this service and
  # the depends_on block above.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Optional voice input. Uncomment and set WHISPER_URL=http://whisper:9000.
  # whisper:
  #   image: onerahmet/openai-whisper-asr-webservice:latest
  #   restart: unless-stopped
  #   environment:
  #     - ASR_MODEL=base        # tiny / base / small / medium / large
  #     - ASR_ENGINE=openai_whisper

volumes:
  ollama_data:
